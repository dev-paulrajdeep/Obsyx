################################################################################
# Obsyx - Noctis Amethyst Screen Lock Configuration
# Token-driven lock screen configuration for hyprlock.
################################################################################

source = ~/.config/hypr/generated/theme-tokens.conf

# Background with live screenshot blur
background {
    monitor =
    path = screenshot
    color = $noctis_void
    blur_passes = $blur_passes
    blur_size = $blur_size
}

# Clock (Hours:Minutes)
label {
    monitor =
    text = $TIME
    font_size = 64
    font_family = JetBrainsMono Nerd Font Bold
    color = $amethyst_ink
    position = 0, 90
    halign = center
    valign = center
}

# Date display
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    color = $ink_default
    position = 0, 160
    halign = center
    valign = center
}

# User display
label {
    monitor =
    text = $USER
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    color = $ink_muted
    position = 0, -20
    halign = center
    valign = center
}

# Password input field
input-field {
    monitor =
    size = 280, 48
    outline_thickness = $border_size
    dots_size = 0.22
    dots_spacing = 0.25
    dots_center = true
    inner_color = $noctis_surface_raised
    outer_color = $amethyst
    font_color = $ink_strong
    check_color = $warning
    fail_color = $danger
    fade_on_empty = false
    rounding = $rounding
    placeholder_text = <i>Password...</i>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    position = 0, -80
    halign = center
    valign = center
}
