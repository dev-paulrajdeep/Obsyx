<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bg-glow" cx="50%" cy="55%" r="65%">
      <stop offset="0%" stop-color="#1f1a2b" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#16131d" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#121018" stop-opacity="1" />
    </radialGradient>

    <radialGradient id="core-glow" cx="50%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#9b7ede" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#8a63d2" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#121018" stop-opacity="0" />
    </radialGradient>

    <!-- Crystal Shading Gradients -->
    <linearGradient id="facet-l1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c7a6ff" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#8a63d2" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="facet-l2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a63d2" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#9b7ede" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="facet-r1" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dacbff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#9b7ede" stop-opacity="0.5" />
    </linearGradient>

    <linearGradient id="facet-r2" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#9b7ede" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#8a63d2" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="facet-dark" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1f1a2b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#16131d" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="facet-core" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#8a63d2" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#dacbff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#c7a6ff" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="ring-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9b7ede" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#dacbff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#8a63d2" stop-opacity="0.3" />
    </linearGradient>

    <!-- Ambient Filter Blur -->
    <filter id="soft-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" />
    </filter>

    <filter id="glow-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="70" />
    </filter>
  </defs>

  <!-- Deep Obsidian Background -->
  <rect width="1920" height="1080" fill="#121018" />
  <rect width="1920" height="1080" fill="url(#bg-glow)" />

  <!-- Ambient Light Orbs -->
  <circle cx="960" cy="540" r="500" fill="url(#core-glow)" filter="url(#glow-blur)" />
  <circle cx="560" cy="380" r="240" fill="#8a63d2" fill-opacity="0.08" filter="url(#soft-blur)" />
  <circle cx="1360" cy="700" r="280" fill="#c7a6ff" fill-opacity="0.06" filter="url(#soft-blur)" />

  <!-- Decorative Orbit Lines & Geometric Rings -->
  <circle cx="960" cy="540" r="380" fill="none" stroke="url(#ring-gradient)" stroke-width="1.5" stroke-dasharray="8 12" />
  <circle cx="960" cy="540" r="460" fill="none" stroke="#26232d" stroke-width="1" stroke-opacity="0.5" />
  <circle cx="960" cy="540" r="260" fill="none" stroke="#9b7ede" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="4 8" />

  <!-- Outer Floating Constellation Diamonds -->
  <g fill="#dacbff" opacity="0.45">
    <polygon points="960,110 964,120 960,130 956,120" />
    <polygon points="960,950 964,960 960,970 956,960" />
    <polygon points="530,540 540,544 550,540 540,536" />
    <polygon points="1370,540 1380,544 1390,540 1380,536" />
    <polygon points="680,280 686,288 680,296 674,288" opacity="0.6" />
    <polygon points="1240,800 1246,808 1240,816 1234,808" opacity="0.6" />
    <polygon points="1280,300 1285,306 1280,312 1275,306" opacity="0.4" />
    <polygon points="640,780 645,786 640,792 635,786" opacity="0.4" />
  </g>

  <!-- Central Amethyst Geometric Prism Lattice -->
  <g id="crystal-lattice">
    <!-- Shadowed back facets -->
    <polygon points="960,320 810,480 840,640 960,760" fill="url(#facet-dark)" stroke="#26232d" stroke-width="1" />
    <polygon points="960,320 1110,480 1080,640 960,760" fill="url(#facet-dark)" stroke="#26232d" stroke-width="1" />

    <!-- Upper left facets -->
    <polygon points="960,320 860,460 960,520" fill="url(#facet-l1)" stroke="#dacbff" stroke-width="0.8" stroke-opacity="0.7" />
    <polygon points="860,460 810,480 870,570 960,520" fill="url(#facet-l2)" stroke="#9b7ede" stroke-width="0.8" stroke-opacity="0.6" />

    <!-- Upper right facets -->
    <polygon points="960,320 1060,460 960,520" fill="url(#facet-r1)" stroke="#dacbff" stroke-width="0.8" stroke-opacity="0.7" />
    <polygon points="1060,460 1110,480 1050,570 960,520" fill="url(#facet-r2)" stroke="#9b7ede" stroke-width="0.8" stroke-opacity="0.6" />

    <!-- Lower left facets -->
    <polygon points="870,570 840,640 960,760 960,630" fill="url(#facet-l2)" stroke="#9b7ede" stroke-width="0.8" stroke-opacity="0.5" />
    <polygon points="870,570 960,520 960,630" fill="url(#facet-l1)" stroke="#dacbff" stroke-width="0.8" stroke-opacity="0.6" />

    <!-- Lower right facets -->
    <polygon points="1050,570 1080,640 960,760 960,630" fill="url(#facet-r2)" stroke="#9b7ede" stroke-width="0.8" stroke-opacity="0.5" />
    <polygon points="1050,570 960,520 960,630" fill="url(#facet-r1)" stroke="#dacbff" stroke-width="0.8" stroke-opacity="0.6" />

    <!-- Core Rhombus Prism Heart -->
    <polygon points="960,440 1010,540 960,620 910,540" fill="url(#facet-core)" stroke="#dacbff" stroke-width="1.5" stroke-opacity="0.9" />

    <!-- Inner light reflection sparkles -->
    <line x1="960" y1="320" x2="960" y2="760" stroke="#dacbff" stroke-width="1" stroke-opacity="0.4" />
    <line x1="810" y1="480" x2="1110" y2="480" stroke="#9b7ede" stroke-width="0.8" stroke-opacity="0.3" />
    <circle cx="960" cy="540" r="4" fill="#ffffff" opacity="0.9" filter="url(#soft-blur)" />
    <circle cx="960" cy="540" r="2" fill="#ffffff" />
  </g>

  <!-- Ambient Micro Grid Accents -->
  <g stroke="#1f1a2b" stroke-width="0.5" opacity="0.4">
    <line x1="100" y1="540" x2="350" y2="540" />
    <line x1="1570" y1="540" x2="1820" y2="540" />
    <line x1="960" y1="50" x2="960" y2="180" />
    <line x1="960" y1="900" x2="960" y2="1030" />
  </g>
</svg>
